problem: s0055_jump_game
method: canJump
total_annotations: 7
requires_count: 3
ensures_count: 4
original_contract_count: 3
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    1 and is less than or equal to 10000.
  original_contract: 1 <= nums.Length <= 10000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    0 and are less than or equal to 100000.
  original_contract: 'forall i: nat :: i < nums.Length ==> 0 <= nums[i] <= 100000'
- id: 2
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: result <==> canReachEnd(nums)
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, there exists a sequence
    of jumps starting from index 0 such that each jump from index `i` is at most the
    value at index `i` of the integer array parameter `nums` and the sequence reaches
    the last index of the integer array parameter `nums`.
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, there does not exist a
    sequence of jumps starting from index 0 such that each jump from index `i` is
    at most the value at index `i` of the integer array parameter `nums` and the sequence
    reaches the last index of the integer array parameter `nums`.
- id: 5
  type: ensures
  nl: If the integer array parameter `nums` is equal to [2,3,1,1,4], the boolean result
    is equal to the true literal.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [3,2,1,0,4], the boolean result
    is equal to the false literal.
