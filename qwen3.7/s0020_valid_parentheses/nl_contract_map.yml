problem: s0020_valid_parentheses
method: isValid
total_annotations: 10
requires_count: 3
ensures_count: 7
original_contract_count: 8
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `s` is greater than or equal to 1 and is
    less than or equal to 10000.
  original_contract: 1 <= |s| <= 10000
- id: 1
  type: requires
  nl: The string parameter `s` consists of only the characters '(' or ')' or '[' or
    ']' or '{' or '}'.
  original_contract: 'forall i: nat :: i < |s| ==> s[i] in [''('', '')'', ''{'', ''}'',
    ''['', '']'']'
- id: 2
  type: requires
  nl: The string parameter `s` is not equal to the null literal.
  original_contract: '|s| % 2 != 0 ==> !result'
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, every open bracket in the
    string parameter `s` is closed by the same type of bracket and every open bracket
    is closed in the correct order.
  original_contract: result ==> |s| % 2 == 0
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, there exists at least one
    open bracket in the string parameter `s` that is not closed by the same type of
    bracket or is not closed in the correct order.
  original_contract: s == "()" ==> result
- id: 5
  type: ensures
  nl: If the string parameter `s` is equal to "()", the boolean result is equal to
    the true literal.
  original_contract: s == "()[]{}" ==> result
- id: 6
  type: ensures
  nl: If the string parameter `s` is equal to "()[]{}", the boolean result is equal
    to the true literal.
  original_contract: s == "(]" ==> !result
- id: 7
  type: ensures
  nl: If the string parameter `s` is equal to "(]", the boolean result is equal to
    the false literal.
  original_contract: s == "{[]}" ==> result
- id: 8
  type: ensures
  nl: If the string parameter `s` is equal to "([)]", the boolean result is equal
    to the false literal.
- id: 9
  type: ensures
  nl: If the string parameter `s` is equal to "{[]}", the boolean result is equal
    to the true literal.
