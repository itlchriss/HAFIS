problem: s0415_add_strings
method: addStrings
total_annotations: 13
requires_count: 8
ensures_count: 5
original_contract_count: 6
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `num1` is greater than or equal to 1 and
    is less than or equal to 10000.
  original_contract: 1 <= |num1| <= 10000
- id: 1
  type: requires
  nl: The length of the string parameter `num2` is greater than or equal to 1 and
    is less than or equal to 10000.
  original_contract: 1 <= |num2| <= 10000
- id: 2
  type: requires
  nl: The string parameter `num1` consists of only digits.
  original_contract: 'forall i: nat :: i < |num1| ==> num1[i] >= ''0'' && num1[i]
    <= ''9'''
- id: 3
  type: requires
  nl: The string parameter `num2` consists of only digits.
  original_contract: 'forall i: nat :: i < |num2| ==> num2[i] >= ''0'' && num2[i]
    <= ''9'''
- id: 4
  type: requires
  nl: The string parameter `num1` does not contain leading zeros.
  original_contract: '|result| >= 1'
- id: 5
  type: requires
  nl: The string parameter `num2` does not contain leading zeros.
  original_contract: 'forall i: nat :: i < |result| ==> result[i] >= ''0'' && result[i]
    <= ''9'''
- id: 6
  type: requires
  nl: The string parameter `num1` is not equal to the null literal.
- id: 7
  type: requires
  nl: The string parameter `num2` is not equal to the null literal.
- id: 8
  type: ensures
  nl: The string result is not equal to the null literal.
- id: 9
  type: ensures
  nl: The string result is the sum of the non-negative integers represented by the
    string parameter `num1` and the string parameter `num2`.
- id: 10
  type: ensures
  nl: If the string parameter `num1` is equal to "11" and the string parameter `num2`
    is equal to "123", the string result is equal to "134".
- id: 11
  type: ensures
  nl: If the string parameter `num1` is equal to "456" and the string parameter `num2`
    is equal to "77", the string result is equal to "533".
- id: 12
  type: ensures
  nl: If the string parameter `num1` is equal to "0" and the string parameter `num2`
    is equal to "0", the string result is equal to "0".
