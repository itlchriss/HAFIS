problem: s0152_maximum_product_subarray
method: maxProduct
total_annotations: 6
requires_count: 3
ensures_count: 3
original_contract_count: 3
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    1 and is less than or equal to 20000.
  original_contract: 1 <= arr.Length <= 20000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -10 and are less than or equal to 10.
  original_contract: 'forall i: nat :: i < arr.Length ==> -10 <= arr[i] <= 10'
- id: 2
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: 'exists lo: nat, hi: nat :: 0 <= lo < hi <= arr.Length &&'
- id: 3
  type: ensures
  nl: The integer result is equal to the maximum product of any contiguous subarray
    of the integer array parameter `nums`.
- id: 4
  type: ensures
  nl: If the integer array parameter `nums` is equal to [2,3,-2,4], the integer result
    is equal to 6.
- id: 5
  type: ensures
  nl: If the integer array parameter `nums` is equal to [-2,0,-1], the integer result
    is equal to 0.
