problem: s0520_detect_capital
method: detectCapitalUse
total_annotations: 7
requires_count: 3
ensures_count: 4
original_contract_count: 1
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `word` is greater than or equal to 1 and
    is less than or equal to 100.
  original_contract: 1 <= |word| <= 100
- id: 1
  type: requires
  nl: The string parameter `word` consists of only lowercase and uppercase English
    letters.
- id: 2
  type: requires
  nl: The string parameter `word` is not equal to the null literal.
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, all letters in the string
    parameter `word` are uppercase or all letters in the string parameter `word` are
    lowercase or only the first letter in the string parameter `word` is uppercase.
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, the usage of capitals in
    the string parameter `word` is not right.
- id: 5
  type: ensures
  nl: If the string parameter `word` is equal to "USA", the boolean result is equal
    to the true literal.
- id: 6
  type: ensures
  nl: If the string parameter `word` is equal to "FlaG", the boolean result is equal
    to the false literal.
