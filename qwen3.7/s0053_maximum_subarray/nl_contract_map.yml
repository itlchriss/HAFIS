problem: s0053_maximum_subarray
method: maxSubArray
total_annotations: 7
requires_count: 3
ensures_count: 4
original_contract_count: 3
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    1 and is less than or equal to 100000.
  original_contract: 1 <= nums.Length <= 100000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -10000 and are less than or equal to 10000.
  original_contract: 'forall i: nat :: i < nums.Length ==> -10000 <= nums[i] <= 10000'
- id: 2
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: 'exists lo: nat, hi: nat :: 0 <= lo <= hi <= nums.Length &&'
- id: 3
  type: ensures
  nl: The integer result is equal to the maximum sum of any contiguous subarray of
    the integer array parameter `nums`.
- id: 4
  type: ensures
  nl: If the integer array parameter `nums` is equal to [-2,1,-3,4,-1,2,1,-5,4], the
    integer result is equal to 6.
- id: 5
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1], the integer result is
    equal to 1.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [5,4,-1,7,8], the integer
    result is equal to 23.
