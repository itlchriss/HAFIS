annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `preorder` is greater than or equal to 1
    and is less than or equal to 10000.
  original_contract: 1 <= |preorder| <= 10000
- id: 1
  type: requires
  nl: The string parameter `preorder` consists of integers in the range [0, 100] and
    '#' separated by commas.
- id: 2
  type: requires
  nl: The string parameter `preorder` is not equal to the null literal.
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, the string parameter `preorder`
    is a correct preorder traversal serialization of a binary tree.
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, the string parameter `preorder`
    is not a correct preorder traversal serialization of a binary tree.
- id: 5
  type: ensures
  nl: If the string parameter `preorder` is equal to "9,3,4,#,#,1,#,#,2,#,6,#,#",
    the boolean result is equal to the true literal.
- id: 6
  type: ensures
  nl: If the string parameter `preorder` is equal to "1,#", the boolean result is
    equal to the false literal.
- id: 7
  type: ensures
  nl: If the string parameter `preorder` is equal to "9,#,#,1", the boolean result
