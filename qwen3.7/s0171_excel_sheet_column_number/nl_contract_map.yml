problem: s0171_excel_sheet_column_number
method: titleToNumber
total_annotations: 9
requires_count: 3
ensures_count: 6
original_contract_count: 6
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `columnTitle` is greater than or equal to
    1 and is less than or equal to 7.
  original_contract: 1 <= |columnTitle| <= 7
- id: 1
  type: requires
  nl: The string parameter `columnTitle` consists of only uppercase English letters.
  original_contract: 'forall i: nat :: i < |columnTitle| ==> ''A'' <= columnTitle[i]
    <= ''Z'''
- id: 2
  type: requires
  nl: The string parameter `columnTitle` is not equal to the null literal.
  original_contract: result >= 1
- id: 3
  type: ensures
  nl: The integer result is greater than or equal to 1 and is less than or equal to
    2147483647.
  original_contract: columnTitle == "A" ==> result == 1
- id: 4
  type: ensures
  nl: The integer result is the column number corresponding to the Excel column title
    represented by the string parameter `columnTitle`.
  original_contract: columnTitle == "AB" ==> result == 28
- id: 5
  type: ensures
  nl: If the string parameter `columnTitle` is equal to "A", the integer result is
    equal to 1.
  original_contract: columnTitle == "ZY" ==> result == 701
- id: 6
  type: ensures
  nl: If the string parameter `columnTitle` is equal to "AB", the integer result is
    equal to 28.
- id: 7
  type: ensures
  nl: If the string parameter `columnTitle` is equal to "ZY", the integer result is
    equal to 701.
- id: 8
  type: ensures
  nl: If the string parameter `columnTitle` is equal to "FXSHRXW", the integer result
    is equal to 2147483647.
