problem: s0065_valid_number
method: isNumber
total_annotations: 9
requires_count: 3
ensures_count: 6
original_contract_count: 1
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `s` is greater than or equal to 1 and is
    less than or equal to 20.
  original_contract: 1 <= |s| <= 20
- id: 1
  type: requires
  nl: The string parameter `s` consists of only English letters or digits or the characters
    '+' or '-' or '.'.
- id: 2
  type: requires
  nl: The string parameter `s` is not equal to the null literal.
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, the string parameter `s`
    is a valid number that can be composed of an optional sign followed by a decimal
    number or an integer optionally followed by an exponent part consisting of 'e'
    or 'E' and an integer.
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, the string parameter `s`
    is not a valid number.
- id: 5
  type: ensures
  nl: If the string parameter `s` is equal to "0", the boolean result is equal to
    the true literal.
- id: 6
  type: ensures
  nl: If the string parameter `s` is equal to "e", the boolean result is equal to
    the false literal.
- id: 7
  type: ensures
  nl: If the string parameter `s` is equal to ".", the boolean result is equal to
    the false literal.
- id: 8
  type: ensures
  nl: If the string parameter `s` is equal to ".1", the boolean result is equal to
    the true literal.
