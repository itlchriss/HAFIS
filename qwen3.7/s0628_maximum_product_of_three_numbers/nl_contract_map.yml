problem: s0628_maximum_product_of_three_numbers
method: maximumProduct
total_annotations: 7
requires_count: 3
ensures_count: 4
original_contract_count: 2
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    3 and is less than or equal to 10000.
  original_contract: 3 <= nums.Length <= 10000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -1000 and are less than or equal to 1000.
  original_contract: 'forall i: nat :: i < nums.Length ==> -1000 <= nums[i] <= 1000'
- id: 2
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
- id: 3
  type: ensures
  nl: The integer result is equal to the maximum product of any three values in the
    integer array parameter `nums`.
- id: 4
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,2,3], the integer result
    is equal to 6.
- id: 5
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,2,3,4], the integer result
    is equal to 24.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [-1,-2,-3], the integer result
