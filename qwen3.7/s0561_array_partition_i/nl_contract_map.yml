problem: s0561_array_partition_i
method: arrayPairSum
total_annotations: 7
requires_count: 4
ensures_count: 3
original_contract_count: 5
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    2 and is less than or equal to 20000.
  original_contract: 2 <= nums.Length <= 10000
- id: 1
  type: requires
  nl: The length of the integer array parameter `nums` is even.
  original_contract: nums.Length % 2 == 0
- id: 2
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -10000 and are less than or equal to 10000.
  original_contract: 'forall i: nat :: i < nums.Length ==> -10000 <= nums[i] <= 10000'
- id: 3
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: 'forall i: nat, j: nat :: 0 <= i < j < nums.Length ==> nums[i]
    <= nums[j]'
- id: 4
  type: ensures
  nl: The integer result is equal to the maximum possible sum of the minimum values
    of each pair when the integer array parameter `nums` is grouped into pairs.
  original_contract: result == sumEvenIndices(nums)
- id: 5
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,4,3,2], the integer result
    is equal to 4.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [6,2,6,5,1,2], the integer
    result is equal to 9.
