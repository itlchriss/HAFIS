problem: s0238_product_of_array_except_self
method: productExceptSelf
total_annotations: 8
requires_count: 3
ensures_count: 5
original_contract_count: 5
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    2 and is less than or equal to 100000.
  original_contract: 2 <= nums.Length <= 100000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -30 and are less than or equal to 30.
  original_contract: 'forall i: nat :: i < nums.Length ==> -30 <= nums[i] <= 30'
- id: 2
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: result != null
- id: 3
  type: ensures
  nl: The integer array result is not equal to the null literal.
  original_contract: result.Length == nums.Length
- id: 4
  type: ensures
  nl: The length of the integer array result is equal to the length of the integer
    array parameter `nums`.
  original_contract: 'forall i: nat :: i < result.Length ==>'
- id: 5
  type: ensures
  nl: For each non-negative integer `i` from 0 to the length of the integer array
    parameter `nums` minus 1 the value at index `i` of the integer array result is
    equal to the product of all values in the integer array parameter `nums` except
    the value at index `i` of the integer array parameter `nums`.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,2,3,4], the integer array
    result is equal to [24,12,8,6].
- id: 7
  type: ensures
  nl: If the integer array parameter `nums` is equal to [-1,1,0,-3,3], the integer
    array result is equal to [0,0,9,0,0].
