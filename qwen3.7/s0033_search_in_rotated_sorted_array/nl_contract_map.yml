problem: s0033_search_in_rotated_sorted_array
method: search
total_annotations: 12
requires_count: 6
ensures_count: 6
original_contract_count: 7
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    1 and is less than or equal to 5000.
  original_contract: 1 <= nums.Length <= 5000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -10000 and are less than or equal to 10000.
  original_contract: 'forall i: nat, j: nat :: 0 <= i < j < nums.Length ==> nums[i]
    != nums[j]'
- id: 2
  type: requires
  nl: All values in the integer array parameter `nums` are unique.
  original_contract: 'forall i: nat :: i < nums.Length ==> -10000 <= nums[i] <= 10000'
- id: 3
  type: requires
  nl: The integer array parameter `nums` is sorted in ascending order before possible
    rotation.
  original_contract: -10000 <= target <= 10000
- id: 4
  type: requires
  nl: The integer parameter `target` is greater than or equal to -10000 and is less
    than or equal to 10000.
  original_contract: -1 <= result < nums.Length
- id: 5
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: result >= 0 ==> nums[result] == target
- id: 6
  type: ensures
  nl: The integer result is greater than or equal to -1 and is less than the length
    of the integer array parameter `nums`.
  original_contract: 'result == -1 ==> (forall i: nat :: i < nums.Length ==> nums[i]
    != target)'
- id: 7
  type: ensures
  nl: If the integer result is greater than or equal to 0, the value at the integer
    result index of the integer array parameter `nums` is equal to the integer parameter
    `target`.
- id: 8
  type: ensures
  nl: If the integer result is equal to -1, there does not exist any index `i` such
    that the value at index `i` of the integer array parameter `nums` is equal to
    the integer parameter `target`.
- id: 9
  type: ensures
  nl: If the integer array parameter `nums` is equal to [4,5,6,7,0,1,2] and the integer
    parameter `target` is equal to 0, the integer result is equal to 4.
- id: 10
  type: ensures
  nl: If the integer array parameter `nums` is equal to [4,5,6,7,0,1,2] and the integer
    parameter `target` is equal to 3, the integer result is equal to -1.
- id: 11
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1] and the integer parameter
    `target` is equal to 0, the integer result is equal to -1.
