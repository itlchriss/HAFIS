problem: s0709_to_lower_case
method: toLowerCase
total_annotations: 10
requires_count: 3
ensures_count: 7
original_contract_count: 2
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `s` is greater than or equal to 1 and is
    less than or equal to 100.
  original_contract: 1 <= |s| <= 100
- id: 1
  type: requires
  nl: The string parameter `s` consists of only printable ASCII characters.
  original_contract: '|result| == |s|'
- id: 2
  type: requires
  nl: The string parameter `s` is not equal to the null literal.
- id: 3
  type: ensures
  nl: The string result is not equal to the null literal.
- id: 4
  type: ensures
  nl: The length of the string result is equal to the length of the string parameter
    `s`.
- id: 5
  type: ensures
  nl: For every non-negative integer `i` that is less than the length of the string
    parameter `s`, if the character at index `i` of the string parameter `s` is an
    uppercase letter, the character at index `i` of the string result is the corresponding
    lowercase letter.
- id: 6
  type: ensures
  nl: For every non-negative integer `i` that is less than the length of the string
    parameter `s`, if the character at index `i` of the string parameter `s` is not
    an uppercase letter, the character at index `i` of the string result is equal
    to the character at index `i` of the string parameter `s`.
- id: 7
  type: ensures
  nl: If the string parameter `s` is equal to "Hello", the string result is equal
    to "hello".
- id: 8
  type: ensures
  nl: If the string parameter `s` is equal to "here", the string result is equal to
    "here".
- id: 9
  type: ensures
  nl: If the string parameter `s` is equal to "LOVELY", the string result is equal
    to "lovely".
