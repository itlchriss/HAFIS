problem: s0860_lemonade_change
method: lemonadeChange
total_annotations: 7
requires_count: 3
ensures_count: 4
original_contract_count: 2
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `bills` is greater than or equal to
    1 and is less than or equal to 100000.
  original_contract: 1 <= bills.Length <= 100000
- id: 1
  type: requires
  nl: All values in the integer array parameter `bills` are either 5 or 10 or 20.
  original_contract: 'forall i: nat :: i < bills.Length ==> bills[i] == 5 || bills[i]
    == 10 || bills[i] == 20'
- id: 2
  type: requires
  nl: The integer array parameter `bills` is not equal to the null literal.
- id: 3
  type: ensures
  nl: If the boolean result is equal to the true literal, for every customer from
    index 0 to the length of the integer array parameter `bills` minus 1, the correct
    change can be provided using only the bills collected from customers before that
    customer.
- id: 4
  type: ensures
  nl: If the boolean result is equal to the false literal, there exists at least one
    customer for whom the correct change cannot be provided using only the bills collected
    from customers before that customer.
- id: 5
  type: ensures
  nl: If the integer array parameter `bills` is equal to [5,5,5,10,20], the boolean
    result is equal to the true literal.
- id: 6
  type: ensures
  nl: If the integer array parameter `bills` is equal to [5,5,10,10,20], the boolean
    result is equal to the false literal.
