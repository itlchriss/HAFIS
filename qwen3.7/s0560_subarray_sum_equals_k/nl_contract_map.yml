problem: s0560_subarray_sum_equals_k
method: subarraySum
total_annotations: 8
requires_count: 4
ensures_count: 4
original_contract_count: 5
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `nums` is greater than or equal to
    1 and is less than or equal to 20000.
  original_contract: 1 <= nums.Length <= 20000
- id: 1
  type: requires
  nl: All values in the integer array parameter `nums` are greater than or equal to
    -1000 and are less than or equal to 1000.
  original_contract: 'forall i: nat :: i < nums.Length ==> -1000 <= nums[i] <= 1000'
- id: 2
  type: requires
  nl: The integer parameter `k` is greater than or equal to -10000000 and is less
    than or equal to 10000000.
  original_contract: -10000000 <= k <= 10000000
- id: 3
  type: requires
  nl: The integer array parameter `nums` is not equal to the null literal.
  original_contract: result >= 0
- id: 4
  type: ensures
  nl: The integer result is greater than or equal to 0.
  original_contract: result == countSubarraysWithSumK(nums, k)
- id: 5
  type: ensures
  nl: The integer result is equal to the total number of contiguous subarrays whose
    sum equals the integer parameter `k`.
- id: 6
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,1,1] and the integer parameter
    `k` is equal to 2, the integer result is equal to 2.
- id: 7
  type: ensures
  nl: If the integer array parameter `nums` is equal to [1,2,3] and the integer parameter
    `k` is equal to 3, the integer result is equal to 2.
