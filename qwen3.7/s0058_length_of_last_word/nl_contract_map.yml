problem: s0058_length_of_last_word
method: lengthOfLastWord
total_annotations: 9
requires_count: 4
ensures_count: 5
original_contract_count: 5
annotations:
- id: 0
  type: requires
  nl: The length of the string parameter `s` is greater than or equal to 1 and is
    less than or equal to 10000.
  original_contract: 1 <= |s| <= 10000
- id: 1
  type: requires
  nl: The string parameter `s` consists of only English letters and spaces.
  original_contract: 'forall i: nat :: i < |s| ==> s[i] != ''\t'' && s[i] != ''\n'''
- id: 2
  type: requires
  nl: There is at least one word in the string parameter `s`.
  original_contract: 'exists i: nat :: i < |s| && s[i] != '' '''
- id: 3
  type: requires
  nl: The string parameter `s` is not equal to the null literal.
  original_contract: result >= 1
- id: 4
  type: ensures
  nl: The integer result is greater than or equal to 1.
  original_contract: result <= |s|
- id: 5
  type: ensures
  nl: The integer result is equal to the length of the last word in the string parameter
    `s`.
- id: 6
  type: ensures
  nl: If the string parameter `s` is equal to "Hello World", the integer result is
    equal to 5.
- id: 7
  type: ensures
  nl: If the string parameter `s` is equal to " fly the string parameter `s` to the
    moon ", the integer result is equal to 4.
- id: 8
  type: ensures
