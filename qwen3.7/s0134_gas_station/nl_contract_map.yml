problem: s0134_gas_station
method: canCompleteCircuit
total_annotations: 12
requires_count: 7
ensures_count: 5
original_contract_count: 7
annotations:
- id: 0
  type: requires
  nl: The length of the integer array parameter `gas` is greater than or equal to
    1 and is less than or equal to 100000.
  original_contract: 1 <= gas.Length <= 100000
- id: 1
  type: requires
  nl: The length of the integer array parameter `cost` is greater than or equal to
    1 and is less than or equal to 100000.
  original_contract: gas.Length == cost.Length
- id: 2
  type: requires
  nl: The length of the integer array parameter `gas` is equal to the length of the
    integer array parameter `cost`.
  original_contract: 'forall i: nat :: i < gas.Length ==> 0 <= gas[i] <= 10000'
- id: 3
  type: requires
  nl: All values in the integer array parameter `gas` are greater than or equal to
    0 and are less than or equal to 10000.
  original_contract: 'forall i: nat :: i < cost.Length ==> 0 <= cost[i] <= 10000'
- id: 4
  type: requires
  nl: All values in the integer array parameter `cost` are greater than or equal to
    0 and are less than or equal to 10000.
  original_contract: -1 <= result < gas.Length
- id: 5
  type: requires
  nl: The integer array parameter `gas` is not equal to the null literal.
  original_contract: result >= 0 ==> canComplete(gas, cost, result)
- id: 6
  type: requires
  nl: The integer array parameter `cost` is not equal to the null literal.
  original_contract: 'result == -1 ==> (forall start: nat :: start < gas.Length ==>
    !canComplete(gas, cost, start))'
- id: 7
  type: ensures
  nl: The integer result is greater than or equal to -1 and is less than the length
    of the integer array parameter `gas`.
- id: 8
  type: ensures
  nl: If the integer result is greater than or equal to 0, starting from the integer
    result index and moving clockwise, the running total of the difference between
    each value in the integer array parameter `gas` and the corresponding value in
    the integer array parameter `cost` is never negative and the traversal returns
    to the starting index.
- id: 9
  type: ensures
  nl: If the integer result is equal to -1, there does not exist any starting index
    from the integer result the circuit can be completed.
- id: 10
  type: ensures
  nl: If the integer array parameter `gas` is equal to [1,2,3,4,5] and the integer
    array parameter `cost` is equal to [3,4,5,1,2], the integer result is equal to
    3.
- id: 11
  type: ensures
  nl: If the integer array parameter `gas` is equal to [2,3,4] and the integer array
    parameter `cost` is equal to [3,4,3], the integer result is equal to -1.
