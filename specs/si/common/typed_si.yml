    primitive_type: 'any'
    reference_type: 'any'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation_type: 'modifier'
  interpretation: __INVOKE__REL__

# === Summation (resolved by backend) ===
- term: sum
