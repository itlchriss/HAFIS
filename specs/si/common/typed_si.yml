# =============================================================================
# Common SI Module: Shared Terms
# =============================================================================
# SI terms shared across all backends (JML and Dafny)
# Backend-specific interpretations are in jml/typed_si.yml and dafny/typed_si.yml
# =============================================================================

# === Basic arithmetic operators ===
- term: negative
  syntax:
  - JJ
  arguments:
  - symbol: Subj
    primitive_type: 'integer'
    reference_type: 'undefined'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: -(Subj)

# === Comparison operators (shared syntax) ===
- term: greater_than_or_equal
  syntax:
  - JJ
  arguments:  
  - symbol: Subj
    primitive_type: 'any'
    reference_type: 'undefined'
  - symbol: Dat
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'expression'
  interpretation: (Subj) >= (Dat)
- term: greater_than
  syntax:
  - JJ
  arguments:  
  - symbol: Subj
    primitive_type: 'any'
    reference_type: 'undefined'
  - symbol: Dat
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'expression'
  interpretation: (Subj) > (Dat)
- term: less_than
  syntax:
  - JJ
  arguments:  
  - symbol: Subj
    primitive_type: 'any'
    reference_type: 'undefined'
  - symbol: Dat
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'expression'
  interpretation: (Subj) < (Dat)
- term: less_than_or_equal
  syntax:
  - JJ
  arguments:  
  - symbol: Subj
    primitive_type: 'any'
    reference_type: 'any'
  - symbol: Dat
    primitive_type: 'any'
    reference_type: 'any'
  interpretation_type: 'expression'
  interpretation: (Subj) <= (Dat)

