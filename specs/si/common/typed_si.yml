# === In/containment (resolved by backend) ===
- term: in
  syntax:
  - IN
  arguments:
  - symbol: y
    primitive_type: 'any'
    reference_type: 'array'
  - symbol: Subj
    primitive_type: 'any'
    reference_type: 'object'
    type_names:
    - __REL__element
    - __REL__value
  interpretation_type: 'modifier'
  interpretation: (y)[i]
- term: in
  syntax:
  - IN
  arguments:
  - symbol: e
    interpretation_type: 'expression'
  - symbol: x
    interpretation_type: 'modifier'
  interpretation_type: 'modifier'
  interpretation: __COMP__

# === Relational placeholder ===
- term: Rel
