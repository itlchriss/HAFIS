# === Basic arithmetic expressions ===
- term: HYPHEN
  syntax:
  - IN
  arguments:
  - symbol: 'Subj'
    primitive_type: 'integer'
    reference_type: 'undefined'
  - symbol: 'Prep'
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation: '(Subj) - (Prep)'
- term: plus
  syntax:
  - IN
  arguments:
