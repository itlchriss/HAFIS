  interpretation: (Subj) == (Dat)

# Distinct/unique elements
- term: distinct
  syntax:
  - JJ
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int, j:int :: 0 <= i < j < |(x)| ==> (x)[i] != (x)[j]

- term: unique
  syntax:
  - JJ
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int, j:int :: 0 <= i < j < |(x)| ==> (x)[i] != (x)[j]

# Non-empty
- term: non-empty
  syntax:
  - JJ
  arity: 1
  arguments:
  - (x)
  interpretation: |(x)| > 0

# Range/bounds
- term: bounded
  syntax:
  - VBN
  arity: 1
  arguments:
  - (x)
  interpretation: exists lo:int, hi:int :: forall i:int :: 0 <= i < |(x)| ==> lo <= (x)[i] <= hi

- term: increasing
  syntax:
  - VBG
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int :: 0 <= i < |(x)| - 1 ==> (x)[i] <= (x)[i + 1]

- term: decreasing
  syntax:
  - VBG
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int :: 0 <= i < |(x)| - 1 ==> (x)[i] >= (x)[i + 1]

- term: strictly increasing
  syntax:
  - VBG
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int :: 0 <= i < |(x)| - 1 ==> (x)[i] < (x)[i + 1]

- term: strictly decreasing
  syntax:
  - VBG
  arity: 1
  arguments:
  - (x)
  interpretation: forall i:int :: 0 <= i < |(x)| - 1 ==> (x)[i] > (x)[i + 1]

