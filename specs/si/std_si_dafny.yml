# Dafny Semantic Interpretation Templates
# This file contains Dafny-specific semantic interpretations
# These templates generate Dafny specifications instead of JML

# =============================================================================
# Core Dafny Specifications
# =============================================================================

# Sorted specifications - Dafny uses ==> for implication in quantifiers
- term: sorted in ascending order
  syntax:
  - NN
  arity: 1
  arguments:
  - (x)
  interpretation: forall k:int :: 0 <= k < |(x)| - 1 ==> (x)[k] <= (x)[k + 1]

- term: sorted in ascending numerical order
  syntax:
  - NN
  arity: 1
  arguments:
  - (x)
  interpretation: forall k:int :: 0 <= k < |(x)| - 1 ==> (x)[k] <= (x)[k + 1]

- term: sorted in descending order
  syntax:
  - NN
  arity: 1
  arguments:
  - (x)
  interpretation: forall k:int :: 0 <= k < |(x)| - 1 ==> (x)[k] >= (x)[k + 1]

# Comparison operators
- term: gtoet
  syntax:
  - JJ
  arity: 2
  arguments:
  - Subj
  - Acc
  interpretation: (Subj) >= (Acc)

- term: gt
  syntax:
  - JJ
  arity: 2
  arguments:
  - Subj
  - Acc
  interpretation: (Subj) > (Acc)

- term: lt
  syntax:
  - JJ
  arity: 2
  arguments:
  - Subj
  - Acc
  interpretation: (Subj) < (Acc)

- term: ltoet
  syntax:
  - JJ
  arity: 2
  arguments:
  - Subj
  - Acc
  interpretation: (Subj) <= (Acc)

# Equality - Dafny uses structural equality
- term: equal to
  syntax:
  - JJ
  - JJR
  - VBG
  - VBZ
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) == (y)

- term: correspondingly equal to
  syntax:
  - VBG
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) != null && (y) != null && |(x)| == |(y)| && (forall i:int :: 0 <= i < |(x)| ==> ((x)[i] == null && (y)[i] == null) || ((x)[i] == (y)[i]))

- term: deeply equals to
  syntax:
  - VBZ
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: ((x) == null && (y) == null) || ((x) != null && (y) != null && |(x)| == |(y)| && (forall i:int :: 0 <= i < |(x)| ==> (x)[i] == (y)[i]))

# Boolean values
- term: true_value
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: 'true'

- term: false_value
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: 'false'

- term: null_value
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: 'null'

- term: null
  syntax:
  - JJ
  arity: 1
  arguments:
  - Subj
  interpretation: '(Subj) == null'

# Be verb
- term: be
  syntax:
  - VBZ
  - VB
  - VBP
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) == (y)

# Result - Dafny uses named return variables
- term: return value
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: r

- term: result
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: r

- term: return
  syntax:
  - VBN
  arity: 1
  arguments:
  - Acc
  interpretation: r

# Contain - Dafny sequence membership
- term: contain
  syntax:
  - VBZ
  - VB
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (y) in (x)

- term: contain
  syntax:
  - VBD
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (y) in old((x))

- term: removed from
  syntax:
  - VBG
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) !in (y)

# Prime number
- term: prime
  syntax:
  - NN
  arity: 1
  arguments:
  - (x)
  interpretation: (x) == 2 || ((x) > 2 && (forall k:int :: 2 <= k <= (x)/2 ==> (x) % k != 0))

- term: prime number
  syntax:
  - NN
  arity: 1
  arguments:
  - (x)
  interpretation: (x) == 2 || ((x) > 2 && (forall k:int :: 2 <= k <= (x)/2 ==> (x) % k != 0))

# Parameter and input
- term: parameter
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: p

- term: input
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: p

# Even/Odd
- term: even
  syntax:
  - RB
  - JJ
  arity: 1
  arguments:
  - (x)
  interpretation: (x) % 2 == 0

- term: odd
  syntax:
  - RB
  - JJ
  arity: 1
  arguments:
  - (x)
  interpretation: (x) % 2 != 0

# Length and size - Dafny uses |seq| for sequence length
- term: length
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: __REL__length

- term: size
  syntax:
  - NN
  arity: 1
  arguments:
  - (*)
  interpretation: __REL__size

# Sort
- term: sort
  syntax:
  - VBN
  arity: 1
  arguments:
  - (x)
  interpretation: forall k:int :: 0 <= k < |(x)| - 1 ==> (x)[k] <= (x)[k+1]

# Conditional
- term: if
  syntax:
  - IN
  arity: 2
  arguments:
  - (*)
  - (*)
  interpretation: ==>

# Element access
- term: element
