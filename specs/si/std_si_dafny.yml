# Additional Dafny-specific constructs

# Sequence operations
- term: append
  syntax:
  - VBN
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) + [(y)]

- term: concat
  syntax:
  - VBN
  arity: 2
  arguments:
  - (x)
  - (y)
  interpretation: (x) + (y)

- term: reverse
  syntax:
  - VBN
  arity: 1
  arguments:
  - (x)
  interpretation: reverse((x))

