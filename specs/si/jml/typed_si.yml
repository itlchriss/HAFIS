# === Java-specific length/size interpretations ===
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).length
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'string_array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).length
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'object'
    type_names:
    - 'list'
    - 'collection'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).size()
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'undefined'
    reference_type: 'string'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).length()
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'list'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).size()

# === Java-specific element access ===
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation: (x)[i]
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'string'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'any'
  interpretation: (x).charAt(i)
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'list'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: (x).get(i)

# === Java-specific quantifier patterns ===
- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: \forall int i; 0 <= i < (x).length; (x)[i]
- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'list'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: \forall int i; 0 <= i < (x).size(); (x).get(i)
- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'string'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: \forall int i; 0 <= i < (x).length(); (x).charAt(i)

# === Java-specific prime/even/unique predicates ===
- term: prime
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'expression_requires_param'
  interpretation: (x) == 2 || ((x) > 2 && (\forall int k; (x) > 2 && 2 <= k && k <=
    (x)/2; (x)%k != 0))
- term: prime_number
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'function'
  interpretation: (x) == 2 || ((x) > 2 && (\forall int k; (x) > 2 && 2 <= k && k <=
    (x)/2; (x)%k != 0))
- term: even
  syntax:
  - RB
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'expression_requires_param'
  interpretation: (x) % 2 == 0
- term: unique
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  interpretation_type: 'expression_requires_param'
  interpretation: \forall int i; 0 <= i < (x).length; (\forall int j; 0 <= j < (x).length && j != i; (x)[j] != (x)[i])

# === Java-specific old/unchanged ===
- term: unchanged
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'array'
  interpretation_type: 'expression_requires_param'
  interpretation: \old((x)) == (x)

# === Java-specific result ===
- term: result
  syntax:
  - NN
  arguments:
  - symbol: '*'
    primitive_type: 'any'
    reference_type: 'any'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation: \result
- term: keyword_result
  syntax:
  - NN
  arguments:
  - symbol: '*'
  interpretation_type: 'value'
  interpretation: \result
