# --- Divisibility ---
- term: is_divisible_by
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  - symbol: y
    primitive_type: 'integer'
    reference_type: 'undefined'
  synthesised_datatype:
    primitive_type: 'boolean'
    reference_type: 'undefined'
  interpretation_type: 'expression'
  interpretation: '(x) % (y) == 0'

# Alias for ccg2lambda which derives _divisible{JJ} from "divisible by"
- term: divisible
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  - symbol: y
    primitive_type: 'integer'
    reference_type: 'undefined'
  synthesised_datatype:
    primitive_type: 'boolean'
    reference_type: 'undefined'
  interpretation_type: 'expression'
  interpretation: '(x) % (y) == 0'

