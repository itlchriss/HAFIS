# =============================================================================
# Dafny SI Module: Arithmetic Operations
# =============================================================================
# SI terms for arithmetic operations in Dafny specifications
# =============================================================================

# --- Addition ---
- term: summation
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation: '+'

- term: plus
  syntax:
  - IN
  arguments:
  - symbol: 'Subj'
    primitive_type: 'integer'
    reference_type: 'undefined'
  - symbol: 'Prep'
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation: '(Subj) + (Prep)'

# Character-reference SI for "+" in non-arithmetic POS categories
# Per dictionary, only plus{IN} (preposition) is the arithmetic form.
# Other POS variants are character references or MR faults.
- term: "+"
  syntax:
  - NNP
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation: "'+'"

- term: "+"
  syntax:
  - JJ
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation: "'+'"

- term: "+"
  syntax:
  - CD
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation: "'+'"

- term: "+"
