# --- Map Lookup ---
- term: value_mapped_to_by
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '[]'

- term: value_associated_with
