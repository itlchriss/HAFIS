# =============================================================================
# Custom Function SI References
# =============================================================================
# Semantic interpretations that reference user-defined custom functions.
# These SIs allow custom functions (defined in specs/functions/*.dfy) to be
# used in meaning representations and synthesised into Dafny ghost functions.
# =============================================================================

# Array aggregation functions
- term: sum_array_elements
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: integer
    reference_type: array
  synthesised_datatype:
    primitive_type: integer
    reference_type: undefined
  interpretation_type: 'custom_function'
  interpretation: 'sum_array_elements(x)'

