# =============================================================================
# Dafny SI Module: Types
# =============================================================================
# SI terms for Dafny type system extensions
# Based on Dafny Reference Manual Sections 6-12
# =============================================================================

# =============================================================================
# Dafny-specific overrides for collection length/cardinality
# These override the Java-style interpretations in common/typed_si.yml
# =============================================================================

# --- Array length in Dafny: array.Length (capital L) ---
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).Length

# --- String array length in Dafny: array.Length ---
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'string_array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).Length

# --- Sequence length in Dafny: |seq| ---
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'seq'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: '|(x)|'

