# --- nat (non-negative integer) ---
- term: nat
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation: ''
  note: 'Type marker for non-negative integers; maps to nat in Dafny'

- term: non-negative integer
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation: ''
  note: 'NL synonym for nat'

