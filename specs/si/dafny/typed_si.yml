# === Dafny-specific length/cardinality interpretations ===
# Array length in Dafny: array.Length (capital L) - Section 15.1
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).Length
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'string_array'
  synthesised_datatype:
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'integer'
  interpretation: (x).Length

# Sequence length in Dafny: |seq| - Section 10.3
- term: __REL__length
  syntax:
  - NN
  arguments:
  - symbol: x
