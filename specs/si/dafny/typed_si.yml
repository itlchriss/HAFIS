# === Dafny-specific element access ===
# Array element: array[i] - Section 15.1
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation: (x)[i]

# Sequence element: seq[i] - Section 10.3
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'seq'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation: (x)[i]

# String character: string[i] - Section 10.3.5
- term: __REL__element
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'undefined'
    reference_type: 'string'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'any'
  interpretation: (x)[i]

# === Dafny-specific quantifier patterns ===
# forall i :: 0 <= i < |x| ==> x[i] - Section 20.34
- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: 'forall i :: 0 <= i < (x).Length ==> (x)[i]'

- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'seq'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: 'forall i :: 0 <= i < |(x)| ==> (x)[i]'

- term: __REL__value
  syntax:
  - NNS
  arguments:
  - symbol: x
    primitive_type: 'undefined'
    reference_type: 'string'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation_type: 'modifier'
  interpretation: 'forall i :: 0 <= i < |(x)| ==> (x)[i]'

# === Dafny-specific prime/even/unique predicates ===
# Using Dafny quantifier syntax: forall k :: ... - Section 20.34
- term: prime
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'expression_requires_param'
  interpretation: '(x) == 2 || ((x) > 2 && (forall k :: 2 <= k && k <= (x)/2 ==> (x)%k != 0))'
- term: prime_number
  syntax:
  - NN
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'function'
  interpretation: '(x) == 2 || ((x) > 2 && (forall k :: 2 <= k && k <= (x)/2 ==> (x)%k != 0))'
- term: even
  syntax:
  - RB
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'undefined'
  interpretation_type: 'expression_requires_param'
  interpretation: (x) % 2 == 0
- term: unique
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'any'
    reference_type: 'array'
  interpretation_type: 'expression_requires_param'
  interpretation: 'forall i :: 0 <= i < (x).Length ==> (forall j :: 0 <= j < (x).Length && j != i ==> (x)[j] != (x)[i])'

# === Dafny-specific old/unchanged ===
# old(expr) - Section 20.24
- term: unchanged
  syntax:
  - JJ
  arguments:
  - symbol: x
    primitive_type: 'integer'
    reference_type: 'array'
  interpretation_type: 'expression_requires_param'
  interpretation: old((x)) == (x)

# === Dafny-specific result ===
# In Dafny, result is just the return variable name, not \result
- term: result
  syntax:
  - NN
  arguments:
  - symbol: '*'
    primitive_type: 'any'
    reference_type: 'any'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'any'
  interpretation: result
- term: keyword_result
  syntax:
  - NN
  arguments:
  - symbol: '*'
  interpretation_type: 'value'
  interpretation: result
