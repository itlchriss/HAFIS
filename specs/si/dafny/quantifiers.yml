# =============================================================================
# Dafny SI Module: Quantifiers
# =============================================================================
# SI terms for quantifier patterns in Dafny specifications
# These complement logic.yml which has the basic quantifier keywords
# =============================================================================

# --- Bounded Universal ---
- term: that is less than
  syntax:
  - IN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '<'
  note: 'Upper bound for quantifier variable'

- term: that is less than or equal to
  syntax:
  - IN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '<='

# --- Index Variable Patterns ---
- term: the value at index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '[]'
  note: 'Array element access pattern'

- term: the character at index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation: '[]'
  note: 'String character access pattern'

- term: the element at index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '[]'
  note: 'Sequence element access pattern'

# --- No-quantifier patterns ---
- term: no
  syntax:
  - DT
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '!exists'
  note: 'Negative existential: "No X satisfies P" = "!exists X :: P"'

- term: none
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '!exists'

# --- All-values shortcut ---
- term: all values in
  syntax:
  - DT
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: 'forall_in'
  note: 'Shortcut for "for every index i, the value at index i of X"'

# --- Satisfies marker ---
- term: satisfies
  syntax:
  - VBZ
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '::'
  note: 'Quantifier body marker, synonym for such that'

- term: satisfy
  syntax:
  - VBP
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '::'
