# =============================================================================
# Dafny SI Module: Quantifiers
# =============================================================================
# SI terms for quantifier patterns in Dafny specifications
# These complement logic.yml which has the basic quantifier keywords
# =============================================================================

# --- Bounded Universal ---
- term: that_is_less_than
  syntax:
  - IN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '<'

- term: that_is_less_than_or_equal_to
  syntax:
  - IN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '<='

# --- Index Variable Patterns ---
- term: value_at_index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '[]'

- term: character_at_index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'character'
    reference_type: 'undefined'
  interpretation: '[]'

- term: element_at_index
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '[]'

# --- No-quantifier patterns ---
- term: no
  syntax:
  - DT
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '!exists'

- term: none
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '!exists'

# --- All-values shortcut ---
- term: all_values_in
  syntax:
  - DT
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: 'forall_in'

# --- Satisfies marker ---
- term: satisfies
  syntax:
  - VBZ
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '::'

- term: satisfy
  syntax:
  - VBP
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'undefined'
  interpretation: '::'
