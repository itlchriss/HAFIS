# --- Multiset from Sequence ---
- term: multiset_formed_from
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'multiset'
  interpretation: 'multiset()'

- term: multiset_of
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'multiset'
  interpretation: 'multiset()'

