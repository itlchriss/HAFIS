# --- Multiset from Sequence ---
- term: the multiset formed from
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'multiset'
  interpretation: 'multiset()'
  note: 'Convert sequence to multiset: multiset(s)'

- term: the multiset of
  syntax:
  - NN
  arguments:
  - symbol: '*'
  synthesised_datatype:
    primitive_type: 'any'
    reference_type: 'multiset'
  interpretation: 'multiset()'

